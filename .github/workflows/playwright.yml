name: Playwright Tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local development setup
        run: supabase start --exclude edge-runtime,imgproxy,logflare,postgres-meta,realtime,storage-api,supavisor,vector &

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Cache npm dependencies
        id: cache-npm-deps
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Cache frontend build
        id: cache-frontend-build
        uses: actions/cache@v4
        with:
          path: |
            ./dist
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('./src/**/*', '**/package-lock.json') }}

      - name: Build frontend
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        run: npm run build

      - name: Wait for Supabase to be ready
        run: |
          timeout=600
          counter=0
          until curl -s http://localhost:54321/rest/v1/ >/dev/null; do
            if [ $counter -gt $timeout ]; then
              echo "Timed out waiting for Supabase"
              exit 1
            fi
            echo "Waiting for Supabase to be ready..."
            sleep 1
            counter=$((counter + 1))
          done
          echo "Supabase is ready!"

      - name: Run Playwright tests
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ vars.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_MAILPIT_URL: ${{ vars.TEST_MAILPIT_URL }}
        run: npm run test -- --project="${{ matrix.browser }}"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled()  }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
